<!DOCTYPE html>
<html>
<head>
    <title>Library Login</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .login-box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        h2{
            color:#003366;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
    </style>

</head>

<body>

<div class="login-box">

<h2>📚 Library Login</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Login</button>
</form>

</div>

</body>
</html>
